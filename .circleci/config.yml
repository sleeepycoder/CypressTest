version: 2.1

jobs:
  cypress-test:
    docker:
      - image: cimg/node:22.17-browsers

    working_directory: ~/project

    environment:
      CI: true

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      - run:
          name: Install Dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Run ESLint
          command: npm run lint

      - run:
          name: Check Formatting
          command: npx prettier --check .

      - run:
          name: Verify Cypress
          command: npx cypress verify

      - run:
          name: Run Cypress Tests
          command: npm run test:report

      # Always upload artifacts, even if tests fail
      - store_artifacts:
          path: cypress/reports
          destination: reports
          when: always

      - store_artifacts:
          path: cypress/screenshots
          destination: screenshots
          when: always

      - store_artifacts:
          path: cypress/videos
          destination: videos
          when: always

workflows:
  version: 2

  qa-pipeline:
    jobs:
      - cypress-test